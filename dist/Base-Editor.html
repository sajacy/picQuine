<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171a19" />
    <title>PicQuine — local image editor</title>
    <style>:root {
  color-scheme: light;
  --bg: #f4f6f4;
  --panel: #fff;
  --workspace: #e6ebe7;
  --field: #f7f9f7;
  --text: #24312b;
  --muted: #627068;
  --line: #d1d9d2;
  --accent: #24795f;
  --accent-text: #fff;
  --selected: #e0eee6;
  --hover: #eaf0eb;
  --checker: #e2e6e2;
  --check-base: #fff;
  font:
    12px -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--text);
  background: var(--bg);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b211e;
  --panel: #222a25;
  --workspace: #131a16;
  --field: #1b231e;
  --text: #e0e8e1;
  --muted: #a4b3a7;
  --line: #3d4b40;
  --accent: #5eb598;
  --accent-text: #10291e;
  --selected: #324c3d;
  --hover: #304034;
  --checker: #626c64;
  --check-base: #a6afa8;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  color: inherit;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  padding: 6px 9px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover {
  background: var(--hover);
}
button:disabled {
  opacity: 0.4;
  cursor: default;
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.primary {
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
}
.primary:hover {
  filter: brightness(1.12);
  background: var(--accent);
}
header {
  height: 46px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 12px;
  background: var(--panel);
}
.brand {
  text-decoration: none;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 22px;
  font-weight: 650;
  letter-spacing: -1px;
}
.mark {
  color: var(--accent);
  font-size: 26px;
}
.file-actions {
  display: flex;
  gap: 2px;
}
.file-actions button {
  font-size: 11px;
}
kbd {
  font: 10px inherit;
  color: var(--muted);
  margin-left: 8px;
}
.documentbar {
  height: 38px;
  display: flex;
  gap: 8px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding: 0 12px;
  color: var(--muted);
  font-size: 11px;
  background: var(--panel);
}
#docName {
  width: 160px;
  color: var(--text);
  font-size: 12px;
  padding: 4px 6px;
}
.pill {
  font-size: 9px;
  border: 1px solid var(--line);
  padding: 2px 4px;
  border-radius: 3px;
  color: var(--muted);
}
.spacer {
  flex: 1;
}
.divider {
  height: 18px;
  border-left: 1px solid var(--line);
}
select,
textarea,
input[type="text"],
input[type="number"],
input:not([type]) {
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px;
  width: 100%;
  min-width: 0;
}
.documentbar select {
  width: 70px;
  padding: 4px;
}
main {
  height: calc(100vh - 84px);
  display: flex;
}
.tools {
  width: 50px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  flex-direction: column;
  padding: 10px 5px;
  gap: 6px;
  border-right: 1px solid var(--line);
  background: var(--panel);
}
.tools button {
  width: 36px;
  height: 37px;
  position: relative;
  font-size: 23px;
  padding: 2px;
}
.tools button.active,
#preview[aria-pressed="true"] {
  background: var(--selected);
  color: var(--accent);
  border-color: var(--accent);
}
.tools small {
  position: absolute;
  right: 3px;
  bottom: 2px;
  font-size: 8px;
  color: var(--muted);
}
.tool-rule {
  width: 25px;
  border-top: 1px solid var(--line);
  margin: 6px;
}
input[type="color"] {
  background: none;
  width: 32px;
  height: 30px;
  border: 0;
  padding: 0;
  cursor: pointer;
}
.tools #help {
  margin-top: auto;
  font-size: 17px;
  color: var(--muted);
}
.workspace {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--workspace);
}
.contextbar {
  min-height: 39px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  font-size: 11px;
  flex-wrap: wrap;
}
.contextbar b {
  font-weight: 600;
}
.contextbar #toolHint {
  color: var(--muted);
}
.contextbar input {
  width: 64px;
  padding: 4px;
}
.contextbar button {
  padding: 5px 8px;
}
#regionControls {
  display: flex;
  align-items: center;
  gap: 7px;
}
#regionControls label {
  display: flex;
  align-items: center;
  gap: 4px;
}
#regionControls input {
  width: 61px;
}
#viewport {
  flex: 1;
  min-height: 0;
  overflow: auto;
  display: grid;
  place-items: center;
  padding: 30px;
}
#stage {
  position: relative;
  flex-shrink: 0;
  background-color: var(--check-base);
  background-image: conic-gradient(
    var(--checker) 25%,
    transparent 0 50%,
    var(--checker) 0 75%,
    transparent 0
  );
  background-size: 16px 16px;
  box-shadow: 0 2px 12px #0002;
  touch-action: none;
}
#stage > canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
#overlay {
  cursor: move;
}
#welcome {
  position: absolute;
  inset: 0;
  background: var(--panel);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 20px;
  text-align: center;
}
h1 {
  font:
    500 24px -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  margin: 0 0 20px;
}
#welcome p {
  color: var(--muted);
  font-size: 11px;
}
#welcome .primary {
  padding: 9px 18px;
}
#welcome .formats {
  font-size: 10px;
  letter-spacing: 0.5px;
  margin: 13px 0;
}
.text-button {
  font-size: 11px;
  color: var(--muted);
}
footer {
  min-height: 29px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 5px 12px;
  gap: 18px;
  font-size: 10px;
  color: var(--muted);
}
#status {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 50%;
}
#coordinates,
#regionSize {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
aside {
  width: 250px;
  flex-shrink: 0;
  border-left: 1px solid var(--line);
  background: var(--panel);
  display: flex;
  flex-direction: column;
  overflow: auto;
}
.panel-head {
  display: flex;
  align-items: center;
  padding: 9px 13px;
  gap: 4px;
}
h2 {
  font-size: 12px;
  font-weight: 600;
  margin: 0;
}
.panel-head h2 {
  margin-right: auto;
}
.panel-head button {
  padding: 3px 6px;
  font-size: 19px;
}
#layers {
  height: 180px;
  min-height: 80px;
  overflow: auto;
  padding: 0 8px;
  flex-shrink: 0;
}
.layer {
  display: flex;
  gap: 8px;
  align-items: center;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 7px 6px;
  margin-bottom: 3px;
  cursor: pointer;
}
.layer.selected {
  background: var(--selected);
  border-color: var(--accent);
}
.layer:hover {
  background: var(--hover);
}
.thumb {
  width: 34px;
  height: 29px;
  object-fit: contain;
  background: repeating-conic-gradient(
      var(--checker) 0% 25%,
      var(--check-base) 0% 50%
    )
    50%/10px 10px;
  border: 1px solid var(--line);
  border-radius: 2px;
}
.layer-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
}
.layer button {
  padding: 3px;
  color: var(--muted);
  font-size: 15px;
}
.layer-actions {
  display: flex;
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
  gap: 2px;
}
.layer-actions button {
  font-size: 11px;
  padding: 5px;
}
.layer-actions button:first-child {
  margin-right: auto;
}
.properties {
  padding: 14px;
}
.properties h2 {
  margin-bottom: 14px;
}
.properties label {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-bottom: 12px;
}
.properties input:not([type="range"]),
.properties select {
  margin-top: 5px;
  font-size: 11px;
}
.fields {
  display: flex;
  gap: 10px;
}
.fields label {
  width: 50%;
}
input[type="range"] {
  display: block;
  width: 100%;
  accent-color: var(--accent);
  margin: 8px 0 0;
}
output {
  float: right;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.rotation-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}
.rotation-controls input {
  flex: 1;
  min-width: 0;
}
.rotation-controls button {
  border: 1px solid var(--line);
  margin-top: 5px;
  color: var(--text);
}
dialog {
  width: 420px;
  max-width: 90vw;
  max-height: 90vh;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--text);
  padding: 20px;
  box-shadow: 0 15px 60px #0004;
}
dialog::backdrop {
  background: #14251d70;
}
.dialog-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
}
.dialog-top h2 {
  font-size: 17px;
}
.dialog-top button {
  font-size: 22px;
}
dialog label {
  display: block;
  margin: 13px 0;
  color: var(--muted);
  font-size: 12px;
}
dialog input,
dialog select,
dialog textarea {
  margin-top: 6px;
}
dialog p {
  line-height: 1.6;
  color: var(--muted);
}
.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%);
  background: var(--accent);
  color: var(--accent-text);
  border-radius: 5px;
  padding: 11px 16px;
  display: none;
  z-index: 10;
  max-width: 80vw;
}
#proofControls {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--accent);
}
#proofFilter {
  width: 105px;
}
.proof-mode #overlay {
  pointer-events: none;
  visibility: hidden;
}
.proof-mode #canvas {
  visibility: hidden;
}
.proof-mode #welcome {
  display: none;
}
.proof-mode .tools,
.proof-mode aside {
  opacity: 0.55;
}
.proof-mode #stage {
  outline: 1px solid var(--accent);
}
#proofProgress {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--panel);
  opacity: 0.9;
  color: var(--accent);
  z-index: 2;
  pointer-events: none;
}
.proof-mode #toolLabel {
  color: var(--accent);
}
[hidden] {
  display: none !important;
}
@media (max-width: 1050px) {
  kbd,
  #toolHint,
  #proofControls > span {
    display: none;
  }
  header {
    gap: 6px;
  }
  aside {
    width: 225px;
  }
  .documentbar {
    gap: 4px;
  }
  #docName {
    width: 125px;
  }
  .contextbar {
    gap: 7px;
  }
  #regionControls {
    gap: 4px;
  }
  #regionControls input {
    width: 53px;
  }
}
@media (max-width: 740px) {
  header {
    padding: 0 6px;
    overflow: auto;
    flex-shrink: 0;
  }
  .brand {
    font-size: 19px;
  }
  .file-actions button,
  header > button {
    font-size: 10px;
    padding: 5px;
  }
  aside {
    width: 185px;
  }
  .properties {
    padding: 10px;
  }
  #layers {
    height: 140px;
  }
  .documentbar {
    overflow: auto;
    flex-shrink: 0;
    padding: 0 7px;
  }
  #docName {
    min-width: 90px;
  }
  .pill,
  #docSize {
    display: none;
  }
  .contextbar {
    padding: 5px 7px;
  }
  #regionControls {
    flex-wrap: wrap;
  }
  #regionControls input {
    width: 51px;
  }
  #viewport {
    padding: 20px;
  }
  footer {
    gap: 9px;
    padding: 5px 7px;
  }
  #status {
    max-width: 25%;
  }
  #layerCount {
    display: none;
  }
  .layer-actions {
    padding: 4px;
  }
  .layer-actions button {
    font-size: 10px;
    padding: 4px;
  }
}

#shapeControls {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}
#shapeControls label {
  display: flex;
  align-items: center;
  gap: 5px;
}
#shapeControls select {
  width: 111px;
  padding: 4px;
}
#shapeControls input[type="color"] {
  width: 27px;
  height: 25px;
  padding: 0;
}
#shapeControls input[type="number"] {
  width: 57px;
}
.contextbar #regionControls {
  flex-wrap: wrap;
}
#shapeControls input:disabled {
  opacity: 0.4;
}
@media (max-width: 1050px) {
  #shapeControls {
    gap: 6px;
  }
  .contextbar:has(#shapeControls:not([hidden])) #toolHint {
    display: none;
  }
}

#svgContent {
  width: 100%;
  font-family: monospace;
}

dialog textarea {
  width: 100%;
  resize: vertical;
}
</style>
  <script type="application/json" id="picquine-editor-info">{"editor":{"id":"org.picquine.editor","profile":"base-editor","version":"0.1.0","build":"475c84f8af50f72b2d32ad53040ef1b2d5fc381ef2a395e33fa91134aebd4523"},"compatibility":{"projectVersions":[3],"extensions":{}}}</script></head>
  <body>
    <header>
      <a class="brand" href="#" aria-label="PicQuine home"
        ><span class="mark">▧</span> PicQuine</a
      >
      <div class="file-actions">
        <button id="new">New</button
        ><button id="open">Open image <kbd>⌘ O</kbd></button
        ><button id="projectOpen">Open project</button
        ><button id="saveProject">Save project</button
        ><button id="loadEditor">Load editor URL</button>
      </div>
      <span class="spacer"></span
      ><button id="theme" aria-pressed="false" title="Switch to dark mode">
        Dark mode</button
      ><button id="export" class="primary">Export image ↗</button>
    </header>
    <div class="documentbar">
      <input
        id="docName"
        aria-label="Project name"
        title="Project name (used for saved files)"
        maxlength="200"
        value="Untitled"
      /><span class="pill">RGBA</span><span id="docSize">1200 × 800 px</span
      ><span class="spacer"></span><button id="undo" title="Undo (⌘Z)">↶</button
      ><button id="redo" title="Redo (⇧⌘Z)">↷</button
      ><span class="divider"></span><button id="resize">Resize</button
      ><button id="preview" aria-pressed="false">Preview</button
      ><label id="proofControls" hidden
        ><span>Proof filter</span>
        <select id="proofFilter" aria-label="Proof resampling filter">
          <option value="bicubic">Bicubic</option>
          <option value="lanczos">Lanczos 3</option>
        </select></label
      ><button id="fit">Fit canvas</button
      ><select id="zoom" aria-label="Zoom">
        <option value="fit">Fit</option>
        <option value="0.25">25%</option>
        <option value="0.5">50%</option>
        <option value="1">100%</option>
        <option value="2">200%</option>
      </select>
    </div>
    <main>
      <nav class="tools" aria-label="Editing tools">
        <button data-tool="move" class="active" title="Move layer (V)">
          ↖<small>V</small></button
        ><button data-tool="crop" title="Crop (C)">⌗<small>C</small></button
        ><button data-tool="brush" title="Brush (B)">╱<small>B</small></button
        ><button data-tool="erase" title="Eraser (E)">▱<small>E</small></button
        ><button data-tool="text" title="Add text (T)">T<small>T</small></button
        ><button data-tool="rect" title="Rectangle (R)">
          □<small>R</small></button
        ><button data-tool="ellipse" title="Ellipse (U)">
          ○<small>U</small>
        </button>
        <div class="tool-rule"></div>
        <input
          id="color"
          type="color"
          value="#287c65"
          title="Paint color"
        /><button id="help" title="Help">?</button>
      </nav>
      <section class="workspace">
        <div class="contextbar">
          <b id="toolLabel">Move</b
          ><span id="toolHint">Drag to position the selected layer</span
          ><span class="spacer"></span>
          <div id="regionControls" hidden>
            <label
              >X <input id="regionX" type="number" step="1" value="0" /></label
            ><label
              >Y <input id="regionY" type="number" step="1" value="0" /></label
            ><label
              >W
              <input
                id="regionW"
                type="number"
                min="1"
                step="1"
                value="100" /></label
            ><label
              >H
              <input
                id="regionH"
                type="number"
                min="1"
                step="1"
                value="100" /></label
            ><button id="addRectangle" class="primary" hidden>
              Add rectangle
            </button>
          </div>
          <div id="shapeControls" hidden>
            <label
              >Mode<select id="shapeMode">
                <option value="stroke">Stroke only</option>
                <option value="both" selected>Stroke + fill</option>
                <option value="fill">Fill only</option>
              </select></label
            ><label
              >Fill<input
                id="shapeFill"
                type="color"
                value="#287c65"
                aria-label="Shape fill color" /></label
            ><label
              >Stroke<input
                id="shapeStroke"
                type="color"
                value="#ff0000"
                aria-label="Shape stroke color" /></label
            ><label
              >Width<input
                id="shapeStrokeWidth"
                type="number"
                min="1"
                max="4096"
                step="1"
                value="4"
                aria-label="Stroke width in pixels"
            /></label>
          </div>
          <label id="brushLabel" hidden
            >Size
            <input id="brushSize" type="number" min="1" max="500" value="24" />
            px</label
          ><button id="applyCrop" hidden class="primary">Apply crop</button
          ><label id="cropLayerLabel" hidden><input id="cropToLayer" type="checkbox" />Crop to new layer</label
          ><button id="cancelCrop" hidden>Cancel</button>
        </div>
        <div id="viewport">
          <div id="stage">
            <canvas id="canvas" width="1200" height="800"></canvas
            ><canvas id="proofCanvas" hidden></canvas>
            <div id="proofProgress" role="status" hidden>Rendering proof…</div>
            <canvas id="overlay" width="1200" height="800"></canvas>
            <div id="welcome">
              <h1 id="welcomeTitle">Image editor</h1>
              <button id="welcomeOpen" class="primary">Open image</button>
              <p class="formats">JPG · PNG · BMP · SVG · WebP · AVIF</p>
              <button id="demo" class="text-button">Open sample</button>
            </div>
          </div>
        </div>
        <footer>
          <span id="status" role="status">Ready</span
          ><span class="spacer"></span><span id="layerCount">0 layers</span
          ><span id="coordinates" aria-label="Canvas coordinates">X — Y —</span
          ><span id="regionSize" aria-label="Selection dimensions"></span>
        </footer>
      </section>
      <aside>
        <div class="panel-head">
          <h2>Layers</h2>
          <button id="addLayer" title="Add transparent layer">＋</button
          ><button id="importLayer" title="Import image as layer">↥</button>
        </div>
        <div id="layers"></div>
        <div class="layer-actions">
          <button id="duplicate" title="Duplicate layer">⧉ Duplicate</button
          ><button id="raise" title="Move layer up">↑</button
          ><button id="lower" title="Move layer down">↓</button
          ><button id="delete" title="Delete layer">⌫</button>
        </div>
        <section class="properties">
          <h2>Layer properties</h2>
          <button id="editLayer" hidden>Edit</button>
          <div id="properties">
            <label
              >Name<input
                id="layerName"
                type="text"
                placeholder="Select a layer" /></label
            ><label
              >Opacity <output id="opacityValue">100%</output
              ><input id="opacity" type="range" min="0" max="100" value="100"
            /></label>
            <div class="fields">
              <label>X<input id="posX" type="number" value="0" /></label
              ><label>Y<input id="posY" type="number" value="0" /></label>
            </div>
            <div class="fields">
              <label
                >Width<input
                  id="layerWidth"
                  type="number"
                  min="1"
                  value="1200" /></label
              ><label
                >Height<input

'use strict';
// Native JSON parsing, with a small pre-scan so duplicate keys cannot disappear
// silently.
const picQuineJSON = {
  equal(left, right) {
    if (left === right) {
      return true;
    }
    if (!left || !right || typeof left !== 'object' ||
        typeof right !== 'object' ||
        Array.isArray(left) !== Array.isArray(right)) {
      return false;
    }
    const keys = Object.keys(left);
    return keys.length === Object.keys(right).length &&
        keys.every(
            (key) => Object.hasOwn(right, key) &&
                picQuineJSON.equal(left[key], right[key]));
  },
  parse(text) {
    const stack = [];
    for (let index = 0; index < text.length; index++) {
      const char = text[index];
      const frame = stack.at(-1);
      if (char === '"') {
        const start = index;
        while (++index < text.length) {
          if (text[index] === '\\') {
            index++;
          } else if (text[index] === '"') {
            break;
          }
        }
        if (frame?.key) {
          const key = JSON.parse(text.slice(start, index + 1));
          if (frame.names.has(key)) {
            throw Error('Duplicate JSON key: ' + key);
          }
          frame.names.add(key);
          frame.key = false;
        }
      } else if (char === '{' || char === '[') {
        if (stack.length >= 100) {
          throw Error('JSON nesting exceeds 100 levels.');
        }
        stack.push(char === '{' ? {names: new Set(), key: true} : {});
      } else if (char === '}' || char === ']') {
        stack.pop();
      } else if (char === ',' && frame?.names) {
        frame.key = true;
      } else if (char === ':' && frame?.names) {
        frame.key = false;
      }
    }
    return JSON.parse(text, (_, value) => {
      if (typeof value === 'number' && !Number.isFinite(value)) {
        throw Error('Non-finite JSON number.');
      }
      return value;
    });
  },
};

'use strict';
/**
 * One HTML file in a standard ZIP. Native streams supply raw DEFLATE via gzip.
 */
const picQuineArchive = (() => {
  const utf8 = new TextEncoder();
  const text = new TextDecoder('utf-8', {fatal: true});
  const maxHTML = picQuineConfig.limits.htmlBytes;
  const table = Uint32Array.from({length: 256}, (_, index) => {
    let crc = index;
    for (let bit = 0; bit < 8; bit++) {
      crc = crc & 1 ? 0xedb88320 ^ (crc >>> 1) : crc >>> 1;
    }
    return crc >>> 0;
  });
  function crc32(bytes) {
    let crc = 0xffffffff;

      crc = table[(crc ^ byte) & 255] ^ (crc >>> 8);

  const view = (bytes) =>
    new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

    return typeof name === 'string' && name.length < 1024 &&
        /\.html$/i.test(name) && !/[\/\\\x00-\x1f]/.test(name);
  }
  async function collect(stream, limit) {
    const reader = stream.getReader();
    const chunks = [];
    let size = 0;
    try {
      while (true) {
        const {value, done} = await reader.read();
        if (done) {
          break;
        }
        size += value.length;
        if (size > limit) {
          throw Error('Project exceeds the uncompressed size limit.');
        }
        chunks.push(value);
      }
    } catch (error) {
      await reader.cancel().catch(() => {});
      throw error;
    } finally {
      reader.releaseLock();
    }
    return new Uint8Array(await new Blob(chunks).arrayBuffer());
  }
  async function pack(name, blob) {
    if (!validName(name)) {
      throw Error('Invalid project HTML filename.');
    }
    if (blob.size > maxHTML) {
      throw Error('Project exceeds the uncompressed size limit.');
    }
    const raw = new Uint8Array(await blob.arrayBuffer());
    const gzip = await collect(
        blob.stream().pipeThrough(new CompressionStream('gzip')),
        maxHTML + 1000000);
    if (gzip[0] !== 31 || gzip[1] !== 139 || gzip[2] !== 8 || gzip[3] !== 0) {
      throw Error('Unexpected native gzip header.');
    }
    // ZIP needs raw DEFLATE, without the fixed gzip header and trailer.
    const deflated = gzip.subarray(10, -8);
    const method = deflated.length < raw.length ? 8 : 0;
    const payload = method ? deflated : raw;

    header.setUint32(0, 0x04034b50, /* littleEndian= */ true);
    header.setUint16(4, 20, true);
    header.setUint16(6, 0x800, true);
    header.setUint16(8, method, true);
    header.setUint16(12, 33, true); // DOS date: 1980-01-01.
    header.setUint32(14, crc, true);
    header.setUint32(18, payload.length, true);
    header.setUint32(22, raw.length, true);
    header.setUint16(26, filename.length, true);
    local.set(filename, 30);
    const central = new Uint8Array(46 + filename.length);
    const directory = view(central);
    directory.setUint32(0, 0x02014b50, true);
    directory.setUint16(4, 0x314, true); // Unix, ZIP 2.0.
    // Version, flags, method, date, CRC, sizes and name length share this
    // layout.
    central.set(local.subarray(4, 28), 6);
    directory.setUint32(38, (0o100644 * 65536) >>> 0, true);
    central.set(filename, 46);
    const end = new Uint8Array(22);
    const trailer = view(end);
    trailer.setUint32(0, 0x06054b50, true);
    trailer.setUint16(8, 1, true);
    trailer.setUint16(10, 1, true);
    trailer.setUint32(12, central.length, true);
    trailer.setUint32(16, local.length + payload.length, true);
    const zip =
        new Blob([local, payload, central, end], {type: 'application/zip'});
    if (zip.size > picQuineConfig.limits.archiveBytes) {
      throw Error('Project archive exceeds 250 MB.');
    }

  }

    if (blob.size > picQuineConfig.limits.archiveBytes) {

    const tail = new Uint8Array(await blob.slice(tailStart).arrayBuffer());
    const trailer = view(tail);
    let end = tail.length - 22;
    while (end >= 0 &&
           !(trailer.getUint32(end, true) === 0x06054b50 &&
             end + 22 + trailer.getUint16(end + 20, true) === tail.length)) {
      end--;
    }
    if (end < 0) {
      throw Error('Not a supported ZIP archive.');
    }
    if (trailer.getUint16(end + 4, true) || trailer.getUint16(end + 6, true) ||
        trailer.getUint16(end + 8, true) !== 1 ||
        trailer.getUint16(end + 10, true) !== 1) {
      throw Error(
          'Project ZIP must contain exactly one HTML file. Older formats are not supported.');
    }
    const size = trailer.getUint32(end + 12, true);
    const start = trailer.getUint32(end + 16, true);
    if (size < 46 || size > 46 + 65535 * 3 ||
        start + size !== tailStart + end) {
      throw Error('Invalid ZIP directory.');
    }
    const central =
        new Uint8Array(await blob.slice(start, start + size).arrayBuffer());
    const directory = view(central);
    const flags = directory.getUint16(8, true);
    const method = directory.getUint16(10, true);
    const crc = directory.getUint32(16, true);
    const packed = directory.getUint32(20, true);
    const length = directory.getUint32(24, true);
    const nameLength = directory.getUint16(28, true);
    const extraLength = directory.getUint16(30, true);
    const commentLength = directory.getUint16(32, true);
    if (directory.getUint32(0, true) !== 0x02014b50 || flags & ~0x808 ||
        ![0, 8].includes(method) ||
        46 + nameLength + extraLength + commentLength !== size ||
        directory.getUint16(34, true) || directory.getUint32(42, true)) {
      throw Error('Unsupported ZIP entry.');
    }
    const name = text.decode(central.subarray(46, 46 + nameLength));
    if (!validName(name)) {
      throw Error(
          'Project ZIP must contain exactly one HTML file. Older formats are not supported.');
    }
    if (length > maxHTML || packed > picQuineConfig.limits.archiveBytes) {
      throw Error('Project exceeds the size limit.');
    }
    if (!method && packed !== length) {
      throw Error('Conflicting ZIP entry sizes.');
    }
    if (start < 30) {
      throw Error('Invalid ZIP local header.');
    }
    const local = new Uint8Array(await blob.slice(0, 30).arrayBuffer());
    const header = view(local);
    const localNameLength = header.getUint16(26, true);
    const localExtraLength = header.getUint16(28, true);
    const dataStart = 30 + localNameLength + localExtraLength;
    if (header.getUint32(0, true) !== 0x04034b50 ||
        header.getUint16(6, true) !== flags ||
        header.getUint16(8, true) !== method || dataStart + packed > start ||
        localNameLength !== nameLength) {
      throw Error('Conflicting ZIP local header.');
    }
    const localName = new Uint8Array(
        await blob.slice(30, 30 + localNameLength).arrayBuffer());
    if (text.decode(localName) !== name ||
        (!(flags & 8) &&
         (header.getUint32(14, true) !== crc ||
          header.getUint32(18, true) !== packed ||
          header.getUint32(22, true) !== length))) {
      throw Error('Conflicting ZIP entry sizes.');
    }
    const stored = blob.slice(dataStart, dataStart + packed);
    let raw;
    if (method === 8) {
      const footer = new Uint8Array(8);
      const checksum = view(footer);
      checksum.setUint32(0, crc, true);
      checksum.setUint32(4, length, true);
      const gzip = new Blob(
          [Uint8Array.of(31, 139, 8, 0, 0, 0, 0, 0, 0, 255), stored, footer]);
      raw = await collect(
          gzip.stream().pipeThrough(new DecompressionStream('gzip')), length);
    } else {
      raw = new Uint8Array(await stored.arrayBuffer());
    }
    if (raw.length !== length || crc32(raw) !== crc) {
      throw Error('ZIP checksum or length mismatch.');
    }
    return {name, blob: new Blob([raw], {type: 'text/html'})};
  }
  return {pack, open, crc32};
})();

    const dw = turn === 180 ? sw : sh;
    const dh = turn === 180 ? sh : sw;
    const bx = x + w / 2 - dw / 2;
    const by = y + h / 2 - dh / 2;
    if (!Number.isInteger(bx) || !Number.isInteger(by)) {

    const src = new Uint8ClampedArray(pixels);

        values[count++] = weight;

      if (Math.abs(sum) < 1e-12) {
        indices[0] = Math.max(0, Math.min(size - 1, Math.round(center)));

              const a = qx * c + qy * s + w / 2;

            (Math.max(0, Math.min(w, u)) * sw) / w - 0.5,
            sw,

            xIndices,
            xValues,

            (Math.max(0, Math.min(h, v)) * sh) / h - 0.5,
            sh,
            stretchY,
            yIndices,
            yValues,
        );
        let red = 0;
        let green = 0;
        let blue = 0;
        let alpha = 0;
        for (let yi = 0; yi < ny; yi++) {
          for (let xi = 0; xi < nx; xi++) {
            const i = (yIndices[yi] * sw + xIndices[xi]) * 4;
            const weight = xValues[xi] * yValues[yi];
            const a = src[i + 3] / 255;

            green += src[i + 1] * a * weight;

        alpha = Math.max(0, Math.min(1, alpha));
        if (alpha > 1e-7) {
          const i = (row * width + col) * 4;
          out[i] = Math.max(0, Math.min(255, red / alpha));
          out[i + 1] = Math.max(0, Math.min(255, green / alpha));
          out[i + 2] = Math.max(0, Math.min(255, blue / alpha));
          out[i + 3] = alpha * coverage * 255;

      self.postMessage({id: data.id, ...result}, [result.pixels.buffer]);

    axisWeights,
    resample,
    workerSource,

'use strict';
const picQuineGeometry = (() => {
  function angle(l) {
    return (l.rotation || 0) % 360;
  }
  function layerCorners(l) {
    const a = (angle(l) * Math.PI) / 180;
    const c = Math.cos(a);
    const s = Math.sin(a);
    const cx = l.x + l.w / 2;
    const cy = l.y + l.h / 2;
    return [
      [-l.w / 2, -l.h / 2],
      [l.w / 2, -l.h / 2],
      [l.w / 2, l.h / 2],
      [-l.w / 2, l.h / 2],
    ].map(([x, y]) => ({x: cx + x * c - y * s, y: cy + x * s + y * c}));
  }
  function layerPoint(l, p) {
    const a = (-angle(l) * Math.PI) / 180;
    const dx = p.x - l.x - l.w / 2;
    const dy = p.y - l.y - l.h / 2;
    return {
      x: ((dx * Math.cos(a) - dy * Math.sin(a) + l.w / 2) * l.canvas.width) /
          l.w,
      y: ((dx * Math.sin(a) + dy * Math.cos(a) + l.h / 2) * l.canvas.height) /
          l.h,
    };
  }
  function normalRect(r) {
    return {
      x: Math.min(r.x, r.x + r.w),
      y: Math.min(r.y, r.y + r.h),
      w: Math.abs(r.w),
      h: Math.abs(r.h),
    };
  }
  function resizeDimensions(ow, oh, width, height, unit) {
    return unit === 'percent' ? {
      w: Math.round((ow * width) / 100),
      h: Math.round((oh * height) / 100),
    } :
                                {w: Math.round(width), h: Math.round(height)};
  }
  return {angle, layerCorners, layerPoint, normalRect, resizeDimensions};
})();

'use strict';
const picQuineDocument = (() => {
  // One filename stem for the ZIP, its HTML entry, and flattened exports.
  function fileStem(value) {
    let name = String(value ?? '')
        .trim()
        .replace(/[\\/:*?"<>|\x00-\x1f\x7f]/g, '-')
        .replace(/[. ]+$/g, '');
    if (/^(con|prn|aux|nul|com[1-9¹²³]|lpt[1-9¹²³])$/i.test(
        name.split('.')[0].trimEnd())) {
      name = '_' + name;
    }
    const encoder = new TextEncoder();
    let stem = '';
    let bytes = 0;
    for (const char of name) {
      bytes += encoder.encode(char).length;
      if (bytes > 240 || stem.length + char.length > 200) {
        break;
      }
      stem += char;
    }
    return stem.replace(/[. ]+$/g, '') || 'Untitled';
  }
  const validID = (id) =>
    typeof id === 'string' && /^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$/.test(id);

  function dimensions(w, h) {
    return (
      Number.isInteger(w) && Number.isInteger(h) && w > 0 && h > 0 &&
        w <= picQuineConfig.limits.imageSide &&
        h <= picQuineConfig.limits.imageSide &&
        w * h <= picQuineConfig.limits.imagePixels);
  }
  function makeTextSource(content, fontFamily, fontSize, color, x, y) {
    return {content, runs: [{content, fontFamily, fontSize, color, x, y}]};
  }
  function validateTextSource(text) {
    if (!text || typeof text.content !== 'string' ||
        text.content.length > 2000 || !Array.isArray(text.runs) ||
        text.runs.length < 1 || text.runs.length > 20) {
      throw Error('Invalid original text metadata.');
    }
    const runs = text.runs.map((r) => {
      if (!r || typeof r.content !== 'string' || r.content.length > 2000 ||
          typeof r.fontFamily !== 'string' || r.fontFamily.length > 100 ||
          !Number.isFinite(r.fontSize) || r.fontSize < 1 || r.fontSize > 1000 ||
          !/^#[0-9a-f]{6}$/i.test(r.color) || !Number.isFinite(r.x) ||
          !Number.isFinite(r.y) || Math.abs(r.x) > 100000 ||
          Math.abs(r.y) > 100000) {
        throw Error('Invalid original text styling.');
      }
      return {
        content: r.content,
        fontFamily: r.fontFamily,
        fontSize: r.fontSize,
        color: r.color,
        x: r.x,
        y: r.y,
      };
    });
    return {content: text.content, runs};
  }
  function validateProject(d) {
    if (!d || typeof d.name !== 'string' || d.name.length > 200 ||
        !dimensions(d.w, d.h) || !Array.isArray(d.layers) ||
        d.layers.length > picQuineConfig.limits.layers) {
      throw Error('Invalid PicQuine project.');
    }
    const ids = new Set();
    for (const l of d.layers) {
      if (!l ||
          !['x', 'y', 'w', 'h', 'opacity'].every(
              (k) => Number.isFinite(l[k])) ||
          l.w <= 0 || l.h <= 0 || l.w > 100000 || l.h > 100000 ||
          Math.abs(l.x) > 1e7 || Math.abs(l.y) > 1e7 || !validID(l.id) ||
          typeof l.name !== 'string' || typeof l.visible !== 'boolean' ||
          l.opacity < 0 || l.opacity > 1 ||
          !picQuineConfig.blendModes.includes(l.blend) || ids.has(l.id)) {
        throw Error('Invalid layer data.');
      }
      if (!Number.isInteger(l.rotation) || l.rotation < 0 || l.rotation > 359) {
        throw Error('Invalid layer rotation.');
      }
      if (l.text) {
        validateTextSource(l.text);
      }
      ids.add(l.id);
    }
    if (d.selected !== null && !ids.has(d.selected)) {
      throw Error('Invalid selected layer.');
    }
  }
  function layerSettings(l) {
    const blends = picQuineConfig.blendModes;
    return {
      id: l.id,
      name: l.name,
      x: l.x,
      y: l.y,
      w: l.w,
      h: l.h,
      opacity: Math.min(1, Math.max(0, l.opacity)),
      visible: !!l.visible,
      blend: blends.includes(l.blend) ? l.blend : 'source-over',
      rotation: (l.rotation || 0) % 360,
      ...(l.text ? {text: validateTextSource(l.text)} : {}),
    };
  }
  return {
    fileStem,
    validID,
    dimensions,
    makeTextSource,
    validateTextSource,
    validateProject,
    layerSettings,
  };
})();

'use strict';
const picQuineImages = (() => {
  let decoder;
  let sequence = 0;
  const requests = new Map();
  const {dimensions} = picQuineDocument;
  function loadDecoder() {
    if (decoder) {
      return decoder;
    }
    // Share startup across imports; a failed worker clears the cached promise.
    decoder = (async () => {
      if (typeof globalThis.picQuineHEICSource !== 'string') {
        throw Error('The embedded HEIC decoder is missing.');
      }
      const raw = atob(globalThis.picQuineHEICSource);
      const chunks = [];
      for (let offset = 0; offset < raw.length; offset += 65536) {
        chunks.push(Uint8Array.from(
            raw.slice(offset, offset + 65536),
            (char) => char.charCodeAt(0)));
      }
      const stream = new Blob(chunks).stream().pipeThrough(
          new DecompressionStream('gzip'));
      const url = URL.createObjectURL(new Blob(
          [await new Response(stream).blob()],
          {type: 'application/javascript'}));
      let worker;
      try {
        worker = new Worker(url);
      } finally {
        URL.revokeObjectURL(url);
      }
      return new Promise((resolve, reject) => {
        const fail = (error) => {
          worker.terminate();
          decoder = null;
          for (const request of requests.values()) {
            request.reject(error);
          }
          requests.clear();
          reject(error);
        };
        worker.onmessage = ({data}) => {
          if (data.ready) {
            return resolve(worker);
          }
          if (data.id === undefined) {
            return fail(
                Error(data.error || 'HEIC decoder could not start.'));
          }
          const request = requests.get(data.id);
          if (!request) {
            return;
          }
          requests.delete(data.id);
          if (data.error) {
            request.reject(Error(data.error));
          } else {
            request.resolve(data);
          }
        };
        worker.onerror = () =>
          fail(Error('The local HEIC decoder failed.'));
      });
    })().catch((error) => {
      decoder = null;
      throw error;
    });
    return decoder;
  }
  async function decodeHEIC(file) {
    const worker = await loadDecoder();
    const buffer = await file.arrayBuffer();
    const id = ++sequence;
    const result = await new Promise((resolve, reject) => {
      requests.set(id, {resolve, reject});
      try {
        worker.postMessage({id, buffer}, [buffer]);
      } catch (error) {
        requests.delete(id);
        reject(error);
      }
    });

    pixels.getContext('2d').putImageData(
        new ImageData(
            new Uint8ClampedArray(result.pixels), result.width, result.height),
        0, 0);

  }
  async function imageFromBlob(blob) {
    const url = URL.createObjectURL(blob);

      return await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(Error('This file could not be decoded.'));
        image.src = url;
      });

      URL.revokeObjectURL(url);
    }
  }
  async function decode(file) {
    let blob = file;
    if (/\.hei[cf]$/i.test(file.name) || /heic|heif/.test(file.type)) {
      status('Decoding HEIC locally…');
      return decodeHEIC(file);
    }
    if (/\.svg$/i.test(file.name) || file.type === 'image/svg+xml') {
      const doc = new DOMParser().parseFromString(
          await file.text(),
          'image/svg+xml',
      );

          doc.documentElement.localName !== 'svg') {
        throw Error('Invalid SVG file.');
      }
      doc.querySelectorAll(
          'script,foreignObject,style,animate,animateTransform,set',
      )
          .forEach((n) => n.remove());
      for (const n of [doc.documentElement, ...doc.querySelectorAll('*')]) {
        for (const a of [...n.attributes]) {
          if (/^on/i.test(a.name) || /url\s*\(/i.test(a.value) ||
              (/(?:href|src)$/i.test(a.name) && !a.value.startsWith('#'))) {
            n.removeAttribute(a.name);

          root.getAttribute('viewBox')?.trim().split(/[\s,]+/).map(Number);
      if (!root.getAttribute('width')) {
        root.setAttribute('width', v?.[2] || 1200);
      }
      if (!root.getAttribute('height')) {
        root.setAttribute('height', v?.[3] || 800);

        type: 'image/svg+xml',

    const image = await imageFromBlob(blob);

    const ext = name.split('.').pop().toLowerCase();

      {
        jpg: 'image/jpeg',
        jpeg: 'image/jpeg',
        png: 'image/png',
        svg: 'image/svg+xml',
        heic: 'image/heic',
        heif: 'image/heif',
        bmp: 'image/bmp',
        webp: 'image/webp',
        avif: 'image/avif',

    return new Promise(
        (resolve, reject) => pixels.toBlob(
            (blob) => blob ? resolve(blob) :

            'image/png',
        ),

})();

'use strict';
const picQuineShapes = (() => {
  function drawShape(c, r, style, kind) {
    const path = (inset) => {
      c.beginPath();
      if (kind === 'ellipse') {
        c.ellipse(
            r.x + r.w / 2,
            r.y + r.h / 2,
            Math.max(0, r.w / 2 - inset),
            Math.max(0, r.h / 2 - inset),
            0,
            0,
            Math.PI * 2,
        );
      } else {
        c.rect(
            r.x + inset,
            r.y + inset,
            Math.max(0, r.w - 2 * inset),
            Math.max(0, r.h - 2 * inset),
        );
      }
    };
    c.save();
    if (style.mode !== 'stroke') {
      path(0);
      c.fillStyle = style.fill;
      c.fill();
    }
    if (style.mode !== 'fill') {
      const width = Math.min(style.strokeWidth, r.w, r.h);
      // Canvas centers strokes on the path; inset to keep entered bounds exact.
      path(width / 2);
      c.strokeStyle = style.stroke;
      c.lineWidth = width;
      c.lineJoin = 'miter';
      c.setLineDash([]);
      c.stroke();
    }
    c.restore();
  }
  return {drawShape};
})();

'use strict';

'use strict';
/**
 * Immutable asset records and retained raw metadata keep unfamiliar fork data
 * intact.
 */
const picQuineProject = (() => {
  const {validID, validateProject, layerSettings, validateTextSource} =
      picQuineDocument;

  const rasters = new WeakMap();

    const map = node.extensions;
    if (map === undefined) {
      return [];
    }
    if (!map || typeof map !== 'object' || Array.isArray(map)) {
      throw Error('Invalid extensions.');
    }
    return Object.entries(map).flatMap(([name, extension]) => {
      if (!/^[a-z][a-z0-9]*(\.[a-z][a-z0-9-]*)+$/.test(name) || !extension ||
          !Number.isInteger(extension.version) || extension.version < 1 ||
          typeof extension.required !== 'boolean' ||
          !Array.isArray(extension.assetRefs) ||
          !extension.assetRefs.every(validID) ||
          new Set(extension.assetRefs).size !== extension.assetRefs.length ||
          !extension.data || typeof extension.data !== 'object' ||
          Array.isArray(extension.data)) {
        throw Error('Invalid extension: ' + name);
      }
      if (name === 'org.picquine.heic' && extension.version === 1 &&
          (extension.data.imageIndex !== 0 || extension.assetRefs.length)) {
        throw Error('Invalid HEIC extension.');
      }
      return extension.assetRefs;
    });
  }
  function reachable(project) {
    const queue = extensions(project);
    for (const layer of project.composition.layers) {
      queue.push(
          layer.content, ...(layer.original ? [layer.original] : []),
          ...extensions(layer));
    }
    // Follow extension references too, including cyclic fork-owned assets.
    const visited = new Set();
    while (queue.length) {
      const id = queue.pop();
      if (!validID(id) || !Object.hasOwn(project.assets, id)) {
        throw Error('Missing project asset: ' + id);
      }
      if (visited.has(id)) {
        continue;
      }
      visited.add(id);
      queue.push(...extensions(project.assets[id]));
    }
    return visited;
  }
  function validate(project) {
    if (!project || project.format !== 'picquine-project' ||
        project.version !== 3 || !project.assets ||
        typeof project.assets !== 'object' || Array.isArray(project.assets)) {
      throw Error('Invalid PicQuine project v3.');
    }
    validateProject(project.composition);
    if ([project, ...project.composition.layers].some(
        (node) => node.extensions?.['org.picquine.heic']?.version === 1)) {
      throw Error('HEIC v1 extensions belong on assets.');
    }
    if (project.composition.layers.some(
        (layer) => layer.text?.extensions !== undefined ||
                layer.text?.runs.some((run) => run.extensions !== undefined))) {
      throw Error('Unsupported extension scope.');
    }
    if (project.composition.extensions !== undefined) {
      throw Error('Extensions belong at project, layer or asset scope.');
    }

        picQuineConfig.limits.compositionBytes) {
      throw Error('Composition metadata exceeds 1 MB.');

    if (entries.length > picQuineConfig.limits.assetFiles) {
      throw Error('Project exceeds the 200 asset file limit.');

    for (const [id, file] of entries) {
      if (!validID(id) || !file || typeof file.name !== 'string' ||
          !file.name || typeof file.type !== 'string' ||

        throw Error('Project exceeds the asset size limit.');

          !(layer.original === null || validID(layer.original))) {

        picQuineConfig.limits.projectPixels) {

      version: 3,
      composition: {
        ...document.project?.composition,
        name: document.name,
        w: document.w,
        h: document.h,
        selected: document.selected,

          id: original.id || uid(),
          file: original.record || {
            name: original.name,
            type: original.type || picQuineImages.imageMime(original.name),
            base64: await picQuineStandalone.base64(original.blob),
          },

    }

      const original =
          layer.original ? await originalAsset(layer.original) : null;

      if (!original || layer.pixelsEdited) {
        let record = rasters.get(layer.canvas);
        if (!record) {
          record = {
            id: uid(),
            file: {
              name: layer.name + '.png',
              type: 'image/png',
              base64: await picQuineStandalone.base64(
                  await assets.png(layer.canvas)),

          rasters.set(layer.canvas, record);

        result.assets[content] = record.file;
      }

        ...layer.record,
        id: layer.id,
        name: layer.name,
        content,
        original,
        x: layer.x,
        y: layer.y,
        w: layer.w,
        h: layer.h,
        rotation: picQuineGeometry.angle(layer),
        opacity: layer.opacity,
        visible: layer.visible,
        blend: layer.blend,
        ...(layer.text ? {
          text: {
            ...layer.record?.text,
            ...validateTextSource(layer.text),
            runs: layer.text.runs.map(
                (run, index) => ({...layer.record?.text?.runs[index], ...run})),
          },
        } :
                         {}),
      });
    }

    for (const id of Object.keys(result.assets)) {
      if (!used.has(id)) {
        delete result.assets[id];
        continue;
      }
      const file = result.assets[id];
      if (/^image\/hei[cf]$/i.test(file.type) &&
          (!file.extensions?.['org.picquine.heic'] ||
           file.extensions['org.picquine.heic'].version === 1)) {
        result.assets[id] = {
          ...file,
          extensions: {
            ...file.extensions,
            'org.picquine.heic': {
              ...file.extensions?.['org.picquine.heic'],
              version: 1,
              required: result.composition.layers.some(
                  (layer) => layer.content === id),
              assetRefs: [],
              data: {
                ...file.extensions?.['org.picquine.heic']?.data,
                imageIndex: 0,
              },
            },
          },
        };
      }
    }
    return validate(result);
  }
  async function restore(project) {
    validate(project);
    const files = new Map();
    for (const [id, record] of Object.entries(project.assets)) {
      const blob = new File(
          [picQuineStandalone.fromBase64(record.base64)], record.name,
          {type: record.type});
      const original = {id, record, blob, name: record.name, type: record.type};
      files.set(id, original);
      originals.set(blob, {id, file: record});
    }
    const missing = picQuineRuntime.compatible(project);
    const readOnly = missing.length > 0;
    const layers = [];
    let pixels = 0;
    for (const record of project.composition.layers) {
      const content = files.get(record.content);
      const original = record.original ? files.get(record.original) : null;
      if (!readOnly &&
          !picQuineConfig.imageTypes.includes(content.type.toLowerCase())) {
        throw Error('Unsupported content type: ' + content.type);
      }
      // Placeholders retain metadata without decoding unsupported content.
      const canvas =
          readOnly ? makeCanvas(1, 1) : await assets.decode(content.blob);
      if ((pixels += canvas.width * canvas.height) >
          picQuineConfig.limits.projectPixels) {
        throw Error('Project exceeds the pixel memory limit.');
      }
      // Reuse saved PNG bytes until a later edit changes this canvas.
      rasters.set(
          canvas, {id: record.content, file: project.assets[record.content]});
      layers.push({
        ...layerSettings(record),
        record,
        canvas,
        original,
        pixelsEdited: record.content !== record.original,
      });

  }
  async function readProject(file) {
    const signature = new Uint8Array(await file.slice(0, 2).arrayBuffer());
    if (signature[0] === 80 && signature[1] === 75) {
      file = (await picQuineArchive.open(file)).blob;
    }
    return restore(
        picQuineStandalone.extract(await picQuineStandalone.readHTML(file)));

    picQuineStandalone.encode(await buildData(document), choice);

    return [
      layer.record,
      layer.original?.record,
      project?.assets?.[layer.record?.content],
    ]
        .some(
            (node) => Object.entries(node?.extensions || {})
                .some(
                    ([name, extension]) =>
                      !picQuineRuntime.info.compatibility
                          .extensions[name]
                          ?.includes(extension.version)));
  }

    validate,
    reachable,
    buildData,
    buildProject,
    restore,
    readProject,
    protects,
  };
})();

'use strict';
/**
 * Document transactions. Source canvases and blobs are immutable between
 * edits.
 */
const picQuineHistory = (() => {
  function clone(document) {
    return {
      ...document,
      layers: document.layers.map((layer) => ({...layer})),
    };
  }
  function create(
      initial,
      {
        canEdit = () => true,
        onChange = () => {},
        maxBytes = picQuineConfig.limits.historyBytes,
        maxEntries = picQuineConfig.limits.historyEntries,
      } = {},
  ) {
    let document = initial;
    let revision = 0;
    let sequence = 0;
    let savedRevision = 0;
    let pending = null;
    const past = [];
    const future = [];
    function snapshot() {
      return {document: clone(document), revision};
    }
    function resources(doc, set) {
      for (const layer of doc.layers) {
        if (layer.canvas) {
          set.set(layer.canvas, layer.canvas.width * layer.canvas.height * 4);
        }
        if (layer.original?.blob) {
          set.set(layer.original.blob, layer.original.blob.size);
        }
      }
    }
    function retainedBytes() {
      const live = new Map();
      const retained = new Map();
      // History pays only for resources not already owned by the live document.
      resources(document, live);
      for (const entry of [...past, ...future]) {
        resources(entry.document, retained);
      }
      let bytes = 0;
      for (const [resource, size] of retained) {
        if (!live.has(resource)) {
          bytes += size;
        }
      }
      return bytes;
    }
    function trim(reserve = 0) {
      while (past.length + future.length > maxEntries ||
             retainedBytes() + reserve > maxBytes) {
        if (past.length) {
          past.shift();
        } else if (future.length) {
          future.shift();
        } else {
          break;
        }
      }
    }
    function changed(before, after) {
      if (before.w !== after.w || before.h !== after.h ||
          before.name !== after.name ||
          before.layers.length !== after.layers.length) {
        return true;
      }
      return before.layers.some((layer, i) => {
        const other = after.layers[i];
        return (
          Object.keys(layer).some((key) => layer[key] !== other[key]) ||
            Object.keys(other).some((key) => layer[key] !== other[key]));
      });
    }
    function commit() {
      if (!pending) {
        return false;
      }
      const entry = pending;
      pending = null;
      if (!changed(entry.document, document)) {
        onChange();
        return false;
      }
      past.push(entry);
      future.length = 0;
      revision = ++sequence;
      trim();
      onChange();
      return true;
    }
    function begin(label = 'Edit', token) {
      if (!canEdit(token)) {
        return false;
      }
      if (!pending) {
        pending = {...snapshot(), label};
      }
      return true;
    }
    function cancel() {
      if (!pending) {
        return;
      }
      document = pending.document;
      revision = pending.revision;
      pending = null;
      onChange();
    }
    function transact(label, mutation, token) {
      if (!canEdit(token)) {
        return false;
      }
      commit();
      begin(label, token);
      try {
        mutation(document);
        return commit();
      } catch (error) {
        cancel();
        throw error;
      }
    }
    function undo() {
      if (!canEdit()) {
        return false;
      }
      commit();
      if (!past.length) {
        return false;
      }
      future.push(snapshot());
      const previous = past.pop();
      document = previous.document;
      revision = previous.revision;
      trim();
      onChange();
      return true;
    }
    function redo() {
      if (!canEdit()) {
        return false;
      }
      commit();
      if (!future.length) {
        return false;
      }
      past.push(snapshot());
      const next = future.pop();
      document = next.document;
      revision = next.revision;
      trim();
      onChange();
      return true;
    }
    return {
      get document() {
        return document;
      },
      set document(next) {
        if (!pending) {
          throw Error('Replace documents inside a transaction.');
        }
        document = next;
      },
      get past() {
        return past;
      },
      get future() {
        return future;
      },
      get revision() {
        return revision;
      },
      get dirty() {
        return (
          revision !== savedRevision ||
            (!!pending && changed(pending.document, document)));
      },
      get active() {
        return !!pending;
      },
      get stats() {
        return {
          retainedBytes: retainedBytes(),
          maxBytes,
          entries: past.length + future.length,
        };
      },
      snapshot: () => clone(document),
      begin,
      commit,
      cancel,
      transact,
      undo,
      redo,
      markSaved(at = revision) {
        savedRevision = at;
        onChange();
      },
      reservePixelEdit(canvas) {
        trim(canvas.width * canvas.height * 4);
      },
    };
  }
  return {create, clone};
})();

'use strict';
/** Single owner for asynchronous I/O and read-only proof mode. */
const picQuineOperations = {
  create(onChange = () => {}) {
    let owner = null;
    return {
      get state() {
        return owner?.name || 'idle';
      },
      get busy() {
        return !!owner && owner.name !== 'proof';
      },
      canEdit(token) {
        return !owner ||
            (token === owner && owner.name !== 'proof' && !owner.previous);
      },
      acquire(name) {
        // Export temporarily owns a completed proof without exiting preview.
        if (owner && !(owner.name === 'proof' && name === 'export')) {
          return null;
        }
        owner = Object.freeze({name, previous: owner});
        onChange();
        return owner;
      },
      release(token) {
        if (owner && owner === token) {
          owner = owner.previous;
          onChange();
        }
      },
    };
  },
};

'use strict';
/**
 * Asset identity is separate from layer transforms. Caches never own source
 * canvases.
 */
const picQuineAssets = (() => {
  const decoded = new WeakMap();
  const pngs = new WeakMap();
  const thumbs = new WeakMap();
  const revisions = new WeakMap();
  const encodedLRU = new Map();
  const limit = 16 * 1024 * 1024;
  let encodedBytes = 0;
  function decodeOnce(file) {
    const cached = decoded.get(file);
    const live = cached?.weak?.deref();
    if (live) {
      return Promise.resolve(live);
    }
    if (cached?.pending) {
      return cached.pending;
    }
    const pending = Promise.resolve().then(() => picQuineImages.decode(file));
    decoded.set(file, {pending});
    pending.then(
        (canvas) => {
          if (typeof WeakRef !== 'undefined') {
            decoded.set(file, {weak: new WeakRef(canvas)});
          } else {
            decoded.delete(file);
          }
          // The source PNG is already encoded and immutable; do not encode it
          // again.
          if (file.type === 'image/png' && file.size <= limit) {
            const entry = {
              valid: true,
              promise: Promise.resolve(file),
              bytes: file.size,
            };
            while (encodedBytes + entry.bytes > limit) {
              const [old, size] = encodedLRU.entries().next().value;
              old.valid = false;
              old.promise = null;
              encodedBytes -= size;
              encodedLRU.delete(old);
            }
            pngs.set(canvas, entry);
            encodedLRU.set(entry, entry.bytes);
            encodedBytes += entry.bytes;
          }
        },
        () => decoded.delete(file),
    );
    return pending;
  }
  function png(canvas) {
    let entry = pngs.get(canvas);
    if (entry?.valid) {
      if (encodedLRU.has(entry)) {
        encodedLRU.delete(entry);
        encodedLRU.set(entry, entry.bytes);
      }
      return entry.promise;
    }
    entry = {valid: true, bytes: 0, promise: null};
    entry.promise =
        Promise.resolve().then(() => picQuineImages.canvasPNG(canvas));
    pngs.set(canvas, entry);
    entry.promise.then(
        (blob) => {
          if (!entry.valid) {
            return;
          }
          entry.bytes = blob.size;
          if (blob.size > limit) {
            entry.valid = false;
            entry.promise = null;
            return;
          }
          while (encodedBytes + blob.size > limit) {
            const [old, size] = encodedLRU.entries().next().value;
            old.valid = false;
            old.promise = null;
            encodedBytes -= size;
            encodedLRU.delete(old);
          }
          encodedLRU.set(entry, blob.size);
          encodedBytes += blob.size;
        },
        () => {
          entry.valid = false;
        },
    );
    return entry.promise;
  }
  function thumbnail(canvas) {
    if (!thumbs.has(canvas)) {
      const thumb = makeCanvas(76, 64);
      const scale = Math.min(76 / canvas.width, 64 / canvas.height);
      thumb.getContext('2d').drawImage(
          canvas,
          (76 - canvas.width * scale) / 2,
          (64 - canvas.height * scale) / 2,
          canvas.width * scale,
          canvas.height * scale,
      );
      thumbs.set(canvas, thumb);
    }
    return thumbs.get(canvas);
  }
  function invalidate(canvas) {
    const entry = pngs.get(canvas);
    if (entry) {
      entry.valid = false;
      entry.promise = null;
      if (encodedLRU.delete(entry)) {
        encodedBytes -= entry.bytes;
      }
      pngs.delete(canvas);
    }
    thumbs.delete(canvas);
    revisions.set(canvas, (revisions.get(canvas) || 0) + 1);
  }
  return {
    decode: decodeOnce,
    png,
    thumbnail,
    invalidate,
    revision: (canvas) => revisions.get(canvas) || 0,
  };
})();

'use strict';
/**
 * Request a native destination during the user's click, before
 * encoding/compression.
 */
const picQuineFiles = (() => {
  async function choose(name, type, description, extensions) {
    if (!window.showSaveFilePicker) {
      return {download: true};
    }
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{description, accept: {[type]: extensions}}],
      });
      return {handle};
    } catch (error) {
      if (error.name === 'AbortError') {
        return null;
      }
      toast('File picker unavailable; downloading instead.');
      return {download: true};
    }
  }
  async function write(blob, name, description, extensions, destination) {
    const target =
        destination || (await choose(name, blob.type, description, extensions));
    if (!target) {
      return false;
    }
    if (target.handle) {
      const writable = await target.handle.createWritable();
      try {
        await writable.write(blob);
        await writable.close();
      } catch (error) {
        await writable.abort?.().catch(() => {});
        throw error;
      }
      return true;
    }
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = name;
    link.click();
    // Let the browser begin the download before releasing its Blob URL.
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    return true;
  }
  return {choose, write};
})();

const picQuineProof = (() => {

  const {angle, layerCorners} = picQuineGeometry;

  let ready = false;
  let epoch = 0;

      task.terminate();
      task = null;
    }

    if (operations.busy || gesture || $('#modal').open) {
      return;

      toast('Add an image or layer before previewing.');
      return;
    }
    if (!active) {
      editor.commit();
      token = operations.acquire('proof');
      if (!token) {

    ready = false;
    operations.release(token);
    token = null;

    setProofUI(false);
    setTool(tool);

    $('#toolLabel').textContent = 'Read-only proof';
    const method = $('#proofFilter').value || 'bicubic';
    const label = method === 'bicubic' ? 'Bicubic' : 'Lanczos 3';
    $('#toolHint').textContent = label + ' · Full resolution · Escape to edit';
    try {
      await renderLayers(proofCanvas, method);
      if (generation !== epoch) {
        return;
      }
      ready = true;
      $('#proofProgress').hidden = true;
      $('#export').disabled = false;
      status(
          `${label} proof · ${editor.document.w} × ${editor.document.h} px · ` +
          'Read-only. Export uses this resampled proof. ' +
          'Use 100% zoom to inspect pixels.');

  async function renderLayers(target, method) {
    const generation = epoch;

        target,
        editor.document.w,
        editor.document.h,
    );

      const url = URL.createObjectURL(
          new Blob([picQuineResample.workerSource()], {
            type: 'application/javascript',
          }),
      );
      try {
        task = new Worker(url);
      } finally {
        URL.revokeObjectURL(url);
      }
      const worker = task;
      const layers = editor.document.layers.filter((layer) => layer.visible);
      let n = 0;
      for (const layer of layers) {
        if (generation !== epoch) {
          throw Error('Proof cancelled.');

        status($('#proofProgress').textContent);

            corners.every((p) => p.y <= 0) ||
            corners.every((p) => p.x >= editor.document.w) ||
            corners.every((p) => p.y >= editor.document.h)) {

            0, 0, layer.canvas.width, layer.canvas.height);

          rejectPending = reject;
          worker.onmessage = ({data}) => {
            rejectPending = null;
            if (data.error) {
              reject(Error(data.error));
            } else {
              resolve(data);
            }
          };
          worker.onerror = () => {

                Error('The local proof worker could not render this image.'),

              {

                pixels: source.data.buffer,
                sw: layer.canvas.width,
                sh: layer.canvas.height,
                x: layer.x,
                y: layer.y,
                w: layer.w,
                h: layer.h,
                cw: editor.document.w,
                ch: editor.document.h,

          throw Error('Proof cancelled.');
        }

          continue;
        }
        const tile = makeCanvas(result.width, result.height);
        tile.getContext('2d').putImageData(
            new ImageData(result.pixels, result.width, result.height),
            0,
            0,
        );
        context.globalAlpha = layer.opacity;
        context.globalCompositeOperation = layer.blend;
        context.drawImage(tile, result.x, result.y);
        tile.width = tile.height = 1;
      }
      if (generation !== epoch) {
        throw Error('Proof cancelled.');
      }
      context.globalAlpha = 1;
      context.globalCompositeOperation = 'source-over';

    } finally {
      if (generation === epoch && task) {
        task.terminate();
        task = null;
      }
    }
  }
  return {
    get active() {
      return active;
    },
    get ready() {
      return ready;
    },
    proofExport,
    renderLayers,
    enterProof,
    exitProof,
    renderProof,
  };
})();

/**
 * Current and staged editor templates. Downloaded HTML is data until reopened.
 */
const picQuineRuntime = (() => {
  let pristine;
  let info;
  let pending = null;
  const slot =
      /(<script\b(?=[^>]*\bid="picquine-project")(?=[^>]*\btype="application\/json")[^>]*>)[\s\S]*?(<\/script\s*>)/gi;
  function capture() {
    const root = document.documentElement.cloneNode(true);
    if (root.querySelector('script[src]')) {
      throw Error('Run npm run build and open dist/Editor-With-HEIC.html.');
    }
    root.querySelector('#picquine-project').textContent = 'null';
    info = picQuineJSON.parse(
        root.querySelector('#picquine-editor-info').textContent);
    pristine = '<!doctype html>\n' + root.outerHTML;
  }
  function compatible(project, target = info) {
    if (!target?.compatibility.projectVersions.includes(project.version)) {
      return ['project version ' + project.version];
    }
    const missing = [];
    for (const node
      of [project, ...project.composition.layers,
        ...Object.values(project.assets)]) {
      for (const [name, extension] of Object.entries(node.extensions || {})) {
        if (extension.required &&
            !target.compatibility.extensions[name]?.includes(
                extension.version)) {
          missing.push(name + ' v' + extension.version);
        }

    return [...new Set(missing)];
  }
  function render(project, choice = 'current') {
    const target = choice === 'loaded' ? pending : {html: pristine, info};
    if (!target) {
      throw Error('No loaded editor bundle.');
    }
    const missing = compatible(project, target.info);
    if (missing.length) {
      throw Error('Editor lacks required support: ' + missing.join(', '));
    }
    // Project text must never close its non-executable script element.
    const json = JSON.stringify(project)
        .replace(/</g, '\\u003c')
        .replace(/\u2028/g, '\\u2028')

  // subsequent bundle loads verifiable without a network dependency.
  function hash(bytes) {

      for (let divisor = 2; divisor * divisor <= candidate; divisor++) {

    view.setUint32(padded.length - 4, bytes.length * 8);

          words[index] = view.getInt32(offset + index * 4);

            (a & b ^ a & c ^ b & c);

        g = f;
        f = e;
        e = d + sum | 0;
        d = c;
        c = b;
        b = a;
        a = sum + major | 0;

      credentials: 'omit',
      referrerPolicy: 'no-referrer',
      redirect: 'error',

    }

        await picQuineStandalone.readText(response.body, 20000000));

            .every((value) => typeof value === 'string' && value.length) ||
        !Array.isArray(bundle.compatibility?.projectVersions) ||
        !bundle.compatibility.projectVersions.length ||
        !bundle.compatibility.projectVersions.every(
            (version) => Number.isInteger(version) && version > 0) ||
        new Set(bundle.compatibility.projectVersions).size !==
            bundle.compatibility.projectVersions.length ||
        !bundle.compatibility.extensions ||
        typeof bundle.compatibility.extensions !== 'object' ||
        Array.isArray(bundle.compatibility.extensions) ||
        bundle.payload?.encoding !== 'gzip+base64' ||
        Object.keys(bundle.payload).sort().join(',') !==
            'base64,encoding,sha256' ||
        !/^[a-f0-9]{64}$/.test(bundle.payload.sha256)) {
      throw Error('Invalid editor bundle.');
    }
    for (const [name, versions] of Object.entries(
        bundle.compatibility.extensions)) {
      if (!/^[a-z][a-z0-9]*(\.[a-z][a-z0-9-]*)+$/.test(name) ||
          !Array.isArray(versions) || !versions.length ||
          new Set(versions).size !== versions.length ||
          !versions.every(
              (version) => Number.isInteger(version) && version > 0)) {
        throw Error('Invalid bundle capabilities.');
      }
    }
    const packed = picQuineStandalone.fromBase64(bundle.payload.base64);
    const html = await picQuineStandalone.readText(
        packed.stream().pipeThrough(new DecompressionStream('gzip')), 20000000);
    const bytes = new TextEncoder().encode(html);
    const digest = crypto.subtle ?
        [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))]
            .map((byte) => byte.toString(16).padStart(2, '0'))
            .join('') :
        hash(bytes);
    if (digest !== bundle.payload.sha256) {
      throw Error('Bundle SHA-256 mismatch.');
    }
    // Inert parsing avoids running code or fetching template subresources.
    const template = document.createElement('template');
    template.innerHTML = html;
    const parsed = template.content;
    const slots = parsed.querySelectorAll('#picquine-project');
    const identities = parsed.querySelectorAll('#picquine-editor-info');
    if (slots.length !== 1 ||
        slots[0].getAttribute('type') !== 'application/json' ||
        slots[0].textContent.trim() !== 'null' || identities.length !== 1 ||
        identities[0].getAttribute('type') !== 'application/json' ||
        parsed.querySelector('script[src],link[href]:not([href^="data:"])')) {
      throw Error('Bundle must contain a complete blank editor HTML.');
    }
    const identity = picQuineJSON.parse(identities[0].textContent);
    if (!picQuineJSON.equal(identity.editor, bundle.editor) ||
        !picQuineJSON.equal(identity.compatibility, bundle.compatibility)) {
      throw Error('Bundle identity mismatch.');
    }
    const project = await picQuineProject.buildData(editor.document);
    const missing = compatible(project, identity);
    if (missing.length) {
      throw Error(
          'Loaded editor lacks required support: ' + missing.join(', '));
    }
    // Commit only after every check, preserving the old candidate on failure.
    pending = {url: address.href, info: identity, html};
    return pending;
  }
  return {
    capture,
    compatible,
    render,
    stage,
    get info() {
      return info;
    },
    get pending() {
      return pending;
    },
  };
})();

'use strict';
const picQuineStandalone = (() => {
  async function base64(blob) {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const chunks = [];
    for (let offset = 0; offset < bytes.length; offset += 32768) {
      chunks.push(
          String.fromCharCode(...bytes.subarray(offset, offset + 32768)));
    }
    return btoa(chunks.join(''));
  }
  function fromBase64(value) {
    if (typeof value !== 'string' ||
        value.length > Math.ceil(picQuineConfig.limits.assetBytes / 3) * 4 ||
        value.length % 4 || !/^[A-Za-z0-9+/]*={0,2}$/.test(value)) {
      throw Error('Invalid Base64 asset.');
    }
    const chunks = [];
    for (let offset = 0; offset < value.length; offset += 65536) {
      const part = value.slice(offset, offset + 65536);
      const raw = atob(part);
      if (btoa(raw) !== part) {
        throw Error('Noncanonical Base64 asset.');
      }
      chunks.push(Uint8Array.from(raw, (char) => char.charCodeAt(0)));
    }
    return new Blob(chunks);
  }
  async function readText(stream, limit = picQuineConfig.limits.htmlBytes) {
    const reader = stream.getReader();
    const chunks = [];
    let bytes = 0;
    try {
      while (true) {
        const {value, done} = await reader.read();
        if (done) {
          break;
        }
        bytes += value.byteLength;
        if (bytes > limit) {
          throw Error('Input exceeds the size limit.');
        }
        chunks.push(value);
      }
    } catch (error) {
      await reader.cancel().catch(() => {});
      throw error;
    } finally {
      reader.releaseLock();
    }
    // Preserve a BOM as text so bundle hashes cover the exact UTF-8 payload.
    return new TextDecoder('utf-8', {fatal: true, ignoreBOM: true})
        .decode(await new Blob(chunks).arrayBuffer());
  }
  function extract(html) {
    const matches = [
      ...html.matchAll(
          /<script\b(?=[^>]*\bid="picquine-project")(?=[^>]*\btype="application\/json")[^>]*>([\s\S]*?)<\/script\s*>/gi),
    ];
    if (matches.length !== 1) {
      throw Error('Open a PicQuine project HTML or single-HTML ZIP file.');
    }
    return picQuineJSON.parse(matches[0][1]);
  }
  async function encode(project, choice) {
    const html = picQuineRuntime.render(project, choice);
    const blob = new Blob([html], {type: 'text/html'});
    if (blob.size > picQuineConfig.limits.htmlBytes) {
      throw Error('Project HTML exceeds the size limit.');
    }
    return picQuineArchive.pack(
        picQuineDocument.fileStem(project.composition.name) + '.html', blob);
  }
  return {
    base64,
    fromBase64,
    readText,
    extract,
    encode,
    readHTML: (blob) => readText(blob.stream()),
    restore: (project) => picQuineProject.restore(project),
  };
})();

'use strict';
// Capture the blank editor before UI mutations become part of future saves.
picQuineRuntime.capture();
const canvas = $('#canvas');
const overlay = $('#overlay');
const overlayContext = overlay.getContext('2d');
let tool = 'move';
let crop = null;
let shapeRegion = null;
let gesture = null;
let importMode = 'open';
const operations = picQuineOperations.create(syncOperationUI);
const editor = picQuineHistory.create(
    {w: 1200, h: 800, name: 'Untitled', layers: [], selected: null},
    {
      canEdit: (token) => operations.canEdit(token) &&
          (!editor.document.readOnly || token?.name === 'open-project'),
      onChange: updateHistory,
    },
);

    (layer) => layer.id === editor.document.selected);

    picQuineGeometry;
const {dimensions} = picQuineDocument;

const assets = picQuineAssets;
const proof = picQuineProof;

let writeFile = picQuineFiles.write;

const {buildProject, readProject} = picQuineProject;
function composite(target, background) {
  return picQuineRenderer.composite(target, editor.document, background);
}

  $('#toast').style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => ($('#toast').style.display = 'none'), 4500);
}

  $('#status').textContent = s;
}

  return editor.snapshot();

    editor.commit();

    render();

      !!editor.document.readOnly || !editor.future.length;

    h: c.height,

  if (proof.active) {

  overlayContext.lineWidth = 1.2 / scale;

async function resize() {
  const ow = editor.document.w;
  const oh = editor.document.h;
  let unit = 'pixels';
  const pending = modal(
      'Resize canvas',
      'resize-fields',
      'Resize',
      () => resizeDimensions(
          ow, oh, +$('#resizeW').value, +$('#resizeH').value, unit),
      () => {
        $('#resizeW').value = ow;
        $('#resizeH').value = oh;
      },
  );

    if ($('#ratio').checked) {
      $('#resizeH').value = unit === 'percent' ?
          $('#resizeW').value :
          Math.max(1, Math.round((+$('#resizeW').value * oh) / ow));
    }
  };
  $('#resizeH').oninput = () => {
    if ($('#ratio').checked) {
      $('#resizeW').value = unit === 'percent' ?
          $('#resizeH').value :
          Math.max(1, Math.round((+$('#resizeH').value * ow) / oh));
    }

  $('#ratio').onchange = () => {
    if ($('#ratio').checked) {
      $('#resizeW').oninput();

    const d = resizeDimensions(
        ow,
        oh,
        +$('#resizeW').value,
        +$('#resizeH').value,
        unit,
    );
    unit = $('#resizeUnit').value;
    $('#resizeW').value =
        unit === 'percent' ? Math.round((d.w / ow) * 10000) / 100 : d.w;
    $('#resizeH').value =
        unit === 'percent' ? Math.round((d.h / oh) * 10000) / 100 : d.h;
  };

  if (!d) {
    return;

  if (!dimensions(d.w, d.h)) {
    return toast('Use dimensions up to 16,384 px and 40 megapixels.');
  }
  mutate('resize', () => {
    const sx = d.w / ow;
    const sy = d.h / oh;
    for (const layer of editor.document.layers) {
      const cx = (layer.x + layer.w / 2) * sx;
      const cy = (layer.y + layer.h / 2) * sy;
      layer.w *= sx;
      layer.h *= sy;
      layer.x = cx - layer.w / 2;
      layer.y = cy - layer.h / 2;
